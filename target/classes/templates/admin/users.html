<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Manage Users</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<nav class="navbar navbar-expand-lg top-nav">
    <div class="container">
        <a class="navbar-brand" th:href="@{/admin/dashboard}">Admin</a>
        <div class="navbar-nav ms-auto">
            <a class="nav-link" th:href="@{/admin/dashboard}">Home</a>
            <a class="nav-link" th:href="@{/admin/hotels}">Manage-Hotels</a>
            <a class="nav-link active" th:href="@{/admin/users}">Manage-User-Details</a>
            <a class="nav-link" th:href="@{/admin/bookings}">Manage-Bookings</a>
            <a class="nav-link" th:href="@{/logout}">Logout</a>
        </div>
    </div>
</nav>
<main class="container py-4">
    <h1 class="page-title">Manage Users</h1>
    <div class="card section-card p-3">
        <div class="table-responsive">
            <table class="table table-striped align-middle">
                <thead><tr><th>ID</th><th>Name</th><th>Email</th><th>Role</th><th>Enabled</th><th>Actions</th></tr></thead>
                <tbody>
                <tr th:each="user : ${users}">
                    <td th:text="${user.id}">1</td>
                    <td th:text="${user.fullName}">Name</td>
                    <td th:text="${user.email}">Email</td>
                    <td th:text="${user.role}">ROLE_USER</td>
                    <td th:text="${user.enabled}">true</td>
                    <td>
                        <form th:if="${user.role.name() == 'ROLE_HOTEL_MANAGER' and !user.enabled}" th:action="@{/admin/managers/{id}/approve(id=${user.id})}" method="post" class="d-inline" onsubmit="return confirmApprove();">
                            <button class="btn btn-sm btn-success" type="submit">Approve</button>
                        </form>
                        <form th:if="${user.role.name() == 'ROLE_HOTEL_MANAGER' or user.role.name() == 'ROLE_USER'}" th:action="@{/admin/managers/{id}/delete(id=${user.id})}" method="post" class="d-inline" onsubmit="return confirmDelete();">
                            <button class="btn btn-sm btn-danger" type="submit">Delete</button>
                        </form>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(users)}"><td colspan="6" class="text-center">No users found</td></tr>
                </tbody>
            </table>
        </div>
    </div>
</main>
<footer class="site-footer">Copyright 2026 Hotel Booking System</footer>
<script>
    function confirmApprove() {
        return confirm("Approve this user?");
    }

    function confirmDelete() {
        return confirm("Delete this user? This action cannot be undone.");
    }
</script>
</body>
</html>
