<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Manage Hotels</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<nav class="navbar navbar-expand-lg top-nav">
    <div class="container">
        <a class="navbar-brand" th:href="@{/admin/dashboard}">Admin</a>
        <div class="navbar-nav ms-auto">
            <a class="nav-link" th:href="@{/admin/dashboard}">Home</a>
            <a class="nav-link active" th:href="@{/admin/hotels}">Manage-Hotels</a>
            <a class="nav-link" th:href="@{/admin/users}">Manage-User-Details</a>
            <a class="nav-link" th:href="@{/admin/bookings}">Manage-Bookings</a>
            <a class="nav-link" th:href="@{/logout}">Logout</a>
        </div>
    </div>
</nav>
<main class="container py-4">
    <h1 class="page-title">Manage Hotels</h1>
    <div class="card section-card p-3">
        <div class="table-responsive">
            <table class="table table-striped align-middle">
                <thead><tr><th>ID</th><th>Name</th><th>City</th><th>Action</th></tr></thead>
                <tbody>
                <tr th:each="hotel : ${hotels}">
                    <td th:text="${hotel.id}">1</td>
                    <td th:text="${hotel.hotelName}">Hotel</td>
                    <td th:text="${hotel.city}">City</td>
                    <td>
                        <a th:href="@{/admin/hotels/{id}(id=${hotel.id})}" class="btn btn-sm btn-brand">
                            VIEW DETAILS
                        </a>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(hotels)}"><td colspan="4" class="text-center">No hotels found</td></tr>
                </tbody>
            </table>
        </div>
    </div>
</main>
<footer class="site-footer">Copyright 2026 Hotel Booking System</footer>
</body>
</html>
