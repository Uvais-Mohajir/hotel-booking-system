<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Book Room</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<nav class="navbar navbar-expand-lg top-nav">
    <div class="container">
        <a class="navbar-brand" th:href="@{/user/dashboard}">Customer</a>
        <div class="navbar-nav ms-auto">
            <a class="nav-link" th:href="@{/user/dashboard}">Home</a>
            <a class="nav-link" th:href="@{/user/hotels/search}">Hotels</a>
            <a class="nav-link active" th:href="@{/user/search-room}">Search-Room</a>
            <a class="nav-link" th:href="@{/user/bookings}">Manage-Booking</a>
            <a class="nav-link" th:href="@{/logout}">Logout</a>
        </div>
    </div>
</nav>

<main class="container py-4">
    <h1 class="page-title">Select your room</h1>
    <div class="alert alert-danger" th:if="${error}" th:text="${error}"></div>
    <div class="alert alert-success" th:if="${success}" th:text="${success}"></div>
    <div class="card property-card p-3 mb-3" th:if="${hotel != null}">
        <h2 class="h5 mb-2" th:text="${hotel.hotelName}">Hotel Name</h2>
        <p class="mb-1"><span class="pill" th:text="${hotel.city}">City</span></p>
        <p class="mb-1" th:text="${hotel.description}">Description</p>
        <a th:if="${hotel.mapsURL != null and !#strings.isEmpty(hotel.mapsURL)}" th:href="${hotel.mapsURL}" target="_blank">View on map</a>
    </div>

    <div class="card property-card p-3">
        <form th:action="@{/user/book}" method="post">
            <input type="hidden" name="hotelId" th:value="${hotel != null ? hotel.id : ''}">
            <div class="row g-3">
                <div class="col-md-6">
                    <label class="form-label">Check-In</label>
                    <input class="form-control" name="checkIn" type="datetime-local" required>
                </div>
                <div class="col-md-6">
                    <label class="form-label">Check-Out</label>
                    <input class="form-control" name="checkOut" type="datetime-local" required>
                </div>
                <div class="col-12">
                    <label class="form-label">Available Rooms</label>
                    <div class="list-group">
                        <label class="list-group-item d-flex justify-content-between align-items-center py-3" th:each="room : ${rooms}">
                            <span class="d-flex flex-column">
                                <span>
                                    <input class="form-check-input me-2" type="radio" name="roomId" th:value="${room.r_id}" required>
                                    <strong th:text="${room.roomType}">SINGLE</strong>
                                </span>
                                <span class="small text-muted" th:text="'Available units: ' + ${room.totalRooms}">Available units</span>
                            </span>
                            <span class="fw-semibold" th:text="'INR ' + ${room.pricePerNight} + ' / night'">INR 0 / night</span>
                        </label>
                    </div>
                </div>
            </div>
            <button class="btn btn-brand mt-3" type="submit">Reserve and Continue to Payment</button>
        </form>
    </div>
</main>

<footer class="site-footer">Copyright 2026 Hotel Booking System</footer>
</body>
</html>
