<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Manage Room</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<nav class="navbar navbar-expand-lg top-nav">
    <div class="container">
        <a class="navbar-brand" th:href="@{/manager/dashboard}">Hotel Manager</a>
        <div class="navbar-nav ms-auto">
            <a class="nav-link" th:href="@{/manager/dashboard}">Home</a>
            <a class="nav-link" th:href="@{/manager/rooms/add}">Add-Room</a>
            <a class="nav-link" th:href="@{/manager/rooms/update}">Update-Room</a>
            <a class="nav-link active" th:href="@{/manager/rooms}">Manage-Room</a>
            <a class="nav-link" th:href="@{/manager/bookings}">Manage-Booking</a>
            <a class="nav-link" th:href="@{/logout}">Logout</a>
        </div>
    </div>
</nav>

<main class="container py-4">
    <h1 class="page-title">Manage Room</h1>
    <div class="card section-card p-3">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h2 class="h5 mb-0">Room Inventory</h2>
            <a class="btn btn-sm btn-brand" th:href="@{/manager/rooms/update}">Go to Update Room</a>
        </div>
        <div class="table-responsive">
            <table class="table table-hover align-middle">
                <thead>
                <tr>
                    <th>Room ID</th>
                    <th>Type</th>
                    <th>Price / Night</th>
                    <th>Total Rooms</th>
                    <th>Available?</th>
                    <th>Hotel ID</th>
                    <th>Action</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="room : ${rooms}">
                    <td th:text="${room.r_id}">1</td>
                    <td><span class="pill" th:text="${room.roomType}">SINGLE</span></td>
                    <td th:text="${room.pricePerNight}">0</td>
                    <td th:text="${room.totalRooms}">0</td>
                    <td th:text="${room.availableRooms ? 'Yes' : 'No'}">Yes</td>
                    <td th:text="${room.hotelId}">1</td>
                    <td>
                        <a class="btn btn-sm btn-outline-primary"
                           th:href="@{/manager/rooms/update(roomId=${room.r_id})}">Edit</a>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(rooms)}">
                    <td colspan="7" class="text-center text-muted">No rooms available.</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</main>

<footer class="site-footer">Copyright 2026 Hotel Booking System</footer>
</body>
</html>
