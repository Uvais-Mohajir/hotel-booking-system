<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Customer Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<nav class="navbar navbar-expand-lg top-nav">
    <div class="container">
        <a class="navbar-brand" th:href="@{/user/dashboard}">Customer</a>
        <div class="navbar-nav ms-auto">
            <a class="nav-link active" th:href="@{/user/dashboard}">Home</a>
            <a class="nav-link" th:href="@{/user/hotels/search}">Hotels</a>
            <a class="nav-link" th:href="@{/user/search-room}">Search-Room</a>
            <a class="nav-link" th:href="@{/user/bookings}">Manage-Booking</a>
            <a class="nav-link" th:href="@{/logout}">Logout</a>
        </div>
    </div>
</nav>

<main class="container py-4">
    <section class="search-hero mb-4">
        <h1 class="h3 mb-1">Find your next stay</h1>
        <p class="mb-3">Search deals on hotels, homes, and more.</p>
        <form method="get" th:action="@{/user/hotels/search}" class="search-strip p-2">
            <div class="row g-2">
                <div class="col-md-9">
                    <input class="form-control" name="city" placeholder="Where are you going?">
                </div>
                <div class="col-md-3">
                    <button class="btn btn-warning w-100" type="submit">Search</button>
                </div>
            </div>
        </form>
    </section>

    <section>
        <h2 class="h4 mb-3">Popular Hotels</h2>
        <div class="row g-3">
            <div class="col-md-6 col-lg-4" th:each="hotel : ${hotels}">
                <div class="card property-card h-100">
                    <div class="property-photo"></div>
                    <div class="card-body">
                        <h3 class="h5 mb-2" th:text="${hotel.hotelName}">Hotel Name</h3>
                        <p class="mb-2"><span class="pill" th:text="${hotel.city}">City</span></p>
                        <p class="small text-muted mb-3" th:text="${hotel.description}">Description</p>
                        <a class="btn btn-brand btn-sm" th:href="@{/user/hotels/{id}(id=${hotel.id})}">See Availability</a>
                    </div>
                </div>
            </div>
            <div class="col-12" th:if="${#lists.isEmpty(hotels)}">
                <div class="alert alert-light border mb-0">No hotel details available.</div>
            </div>
        </div>
    </section>
</main>

<footer class="site-footer">Copyright 2026 Hotel Booking System</footer>
</body>
</html>
