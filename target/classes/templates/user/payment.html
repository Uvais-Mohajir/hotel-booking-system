<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Payment</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<nav class="navbar navbar-expand-lg top-nav">
    <div class="container">
        <a class="navbar-brand" th:href="@{/user/dashboard}">Customer</a>
        <div class="navbar-nav ms-auto">
            <a class="nav-link" th:href="@{/user/dashboard}">Home</a>
            <a class="nav-link" th:href="@{/user/hotels/search}">Hotels</a>
            <a class="nav-link" th:href="@{/user/search-room}">Search-Room</a>
            <a class="nav-link active" th:href="@{/user/bookings}">Manage-Booking</a>
            <a class="nav-link" th:href="@{/logout}">Logout</a>
        </div>
    </div>
</nav>

<main class="container py-4">
    <h1 class="page-title">Complete Payment</h1>
    <div class="card section-card p-4">
        <div class="alert alert-danger" id="paymentError" style="display:none;"></div>
        <p class="mb-1"><strong>Booking ID:</strong> <span th:text="${booking.b_id}">1</span></p>
        <p class="mb-1"><strong>Total Amount:</strong> INR <span th:text="${booking.tAmount}">0</span></p>
        <p class="text-muted small mb-3">Click the button below to pay via Razorpay and confirm your booking.</p>

        <form id="verifyForm" th:action="@{/user/bookings/{id}/payment/verify(id=${booking.b_id})}" method="post">
            <input type="hidden" name="razorpay_payment_id" id="razorpay_payment_id">
            <input type="hidden" name="razorpay_order_id" id="razorpay_order_id">
            <input type="hidden" name="razorpay_signature" id="razorpay_signature">
            <button id="payButton" class="btn btn-brand" type="button">Pay with Razorpay</button>
        </form>
    </div>
</main>

<footer class="site-footer">Copyright 2026 Hotel Booking System</footer>

<script src="https://checkout.razorpay.com/v1/checkout.js"></script>
<script th:inline="javascript">
    const bookingAmount = Number(/*[[${booking.tAmount}]]*/ 0);
    const orderId = /*[[${payment.paymentReferenceId}]]*/ "";
    const keyId = /*[[${razorpayKeyId}]]*/ "";
    const payButton = document.getElementById("payButton");
    const paymentError = document.getElementById("paymentError");

    if (!orderId || !keyId || bookingAmount <= 0) {
        payButton.disabled = true;
        paymentError.style.display = "block";
        paymentError.textContent = "Payment session could not be created. Please go back and try again.";
    }

    const options = {
        key: keyId,
        amount: Math.round(bookingAmount * 100),
        currency: "INR",
        name: "Hotel Booking",
        description: "Room Payment",
        order_id: orderId,
        handler: function (response) {
            document.getElementById("razorpay_payment_id").value = response.razorpay_payment_id;
            document.getElementById("razorpay_order_id").value = response.razorpay_order_id;
            document.getElementById("razorpay_signature").value = response.razorpay_signature;
            document.getElementById("verifyForm").submit();
        },
        theme: { color: "#003b95" }
    };

    payButton.addEventListener("click", function (e) {
        if (!orderId || !keyId || bookingAmount <= 0) {
            return;
        }
        e.preventDefault();
        const rzp = new Razorpay(options);
        rzp.open();
    });
</script>
</body>
</html>
