<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Admin Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<nav class="navbar navbar-expand-lg top-nav">
    <div class="container">
        <a class="navbar-brand" th:href="@{/index}">HotelBooking</a>
        <div class="navbar-nav ms-auto">
            <a class="nav-link" th:href="@{/index}">Home</a>
            <a class="nav-link" th:href="@{/index#about}">About Us</a>
            <a class="nav-link" th:href="@{/index#hotels}">Hotel</a>
            <a class="nav-link" th:href="@{/userRegister}">User-Register</a>
            <a class="nav-link" th:href="@{/userLogin}">User-Login</a>
            <a class="nav-link" th:href="@{/managerRegister}">Manager-Register</a>
            <a class="nav-link" th:href="@{/managerLogin}">Manager-Login</a>
            <a class="nav-link active" th:href="@{/adminLogin}">Admin-Login</a>
            <a class="nav-link" th:href="@{/index#contact}">Contact Us</a>
        </div>
    </div>
</nav>
<main class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-5 col-lg-4">
            <div class="card section-card p-4">
                <h1 class="h4 mb-3">Admin Login</h1>
                <div class="alert alert-danger" th:if="${error}" th:text="${error}"></div>
                <form th:action="@{/adminLogin}" method="post">
                    <input type="hidden" name="role" value="ROLE_ADMIN">
                    <div class="mb-3">
                        <label class="form-label" for="email">Email</label>
                        <input class="form-control" id="email" name="email" type="email" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label" for="password">Password</label>
                        <input class="form-control" id="password" name="password" type="password" required>
                    </div>
                    <button class="btn btn-brand w-100" type="submit">Login</button>
                </form>
            </div>
        </div>
    </div>
</main>
<footer class="site-footer">Copyright 2026 Hotel Booking System</footer>
</body>
</html>
