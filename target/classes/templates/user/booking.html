<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>My Bookings</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<nav class="navbar navbar-expand-lg top-nav">
    <div class="container">
        <a class="navbar-brand" th:href="@{/user/dashboard}">Customer</a>
        <div class="navbar-nav ms-auto">
            <a class="nav-link" th:href="@{/user/dashboard}">Home</a>
            <a class="nav-link" th:href="@{/user/hotels/search}">Hotels</a>
            <a class="nav-link" th:href="@{/user/search-room}">Search-Room</a>
            <a class="nav-link active" th:href="@{/user/bookings}">Manage-Booking</a>
            <a class="nav-link" th:href="@{/logout}">Logout</a>
        </div>
    </div>
</nav>

<main class="container py-4">
    <h1 class="page-title">Manage Booking History</h1>
    <div class="card section-card p-3">
        <div class="table-responsive">
            <table class="table table-striped align-middle">
                <thead>
                <tr>
                    <th>Booking ID</th>
                    <th>Check-In</th>
                    <th>Check-Out</th>
                    <th>Status</th>
                    <th>Total</th>
                    <th>Action</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="booking : ${bookings}">
                    <td><a th:href="@{/user/bookings/{id}(id=${booking.b_id})}" th:text="${booking.b_id}">1</a></td>
                    <td th:text="${#temporals.format(booking.checkIn, 'yyyy-MM-dd HH:mm')}">2026-01-01 12:00</td>
                    <td th:text="${#temporals.format(booking.checkOut, 'yyyy-MM-dd HH:mm')}">2026-01-02 10:00</td>
                    <td><span class="pill" th:text="${booking.status}">CONFIRMED</span></td>
                    <td th:text="${booking.tAmount}">0</td>
                    <td>
                        <a class="btn btn-sm btn-brand mb-1" th:href="@{/user/bookings/{id}/payment(id=${booking.b_id})}">Pay Now</a>
                        <form th:action="@{/user/bookings/{id}/cancel(id=${booking.b_id})}" method="post">
                            <button class="btn btn-sm btn-danger" type="submit">Cancel</button>
                        </form>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(bookings)}">
                    <td colspan="6" class="text-center text-muted">No bookings found.</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</main>

<footer class="site-footer">Copyright 2026 Hotel Booking System</footer>
</body>
</html>
