spring.application.name=hotel-booking-system
server.port=8080

spring.datasource.url=jdbc:mysql://root:OcQyApQvGsGBVtqrODvYHFtRKqumufyI@metro.proxy.rlwy.net:54786/hotel_booking
spring.datasource.username=root
spring.datasource.password=OcQyApQvGsGBVtqrODvYHFtRKqumufyI

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE


spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.cache=${SPRING_THYMELEAF_CACHE:true}

server.error.include-message=always
server.error.include-binding-errors=always
server.error.include-stacktrace=never

payment.gateway=RAZORPAY
payment.currency=INR

razorpay.key.id=${RAZORPAY_KEY_ID:}
razorpay.key.secret=${RAZORPAY_KEY_SECRET:}

server.servlet.session.timeout=3m

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
