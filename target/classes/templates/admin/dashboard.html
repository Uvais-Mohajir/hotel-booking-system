<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Admin Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<nav class="navbar navbar-expand-lg top-nav">
    <div class="container">
        <a class="navbar-brand" th:href="@{/admin/dashboard}">Admin</a>
        <div class="navbar-nav ms-auto">
            <a class="nav-link active" th:href="@{/admin/dashboard}">Home</a>
            <a class="nav-link" th:href="@{/admin/hotels}">Manage-Hotels</a>
            <a class="nav-link" th:href="@{/admin/users}">Manage-User-Details</a>
            <a class="nav-link" th:href="@{/admin/bookings}">Manage-Bookings</a>
            <a class="nav-link" th:href="@{/logout}">Logout</a>
        </div>
    </div>
</nav>
<main class="container py-4">
    <h1 class="page-title">Admin Dashboard</h1>
    <div class="row g-3">
        <div class="col-md-3"><div class="dashboard-stat stat-a"><h6>Total Users</h6><h3 th:text="${totalUsers}">0</h3></div></div>
        <div class="col-md-3"><div class="dashboard-stat stat-b"><h6>Total Hotels</h6><h3 th:text="${totalHotels}">0</h3></div></div>
        <div class="col-md-3"><div class="dashboard-stat stat-c"><h6>Total Bookings</h6><h3 th:text="${totalBookings}">0</h3></div></div>
        <div class="col-md-3"><div class="dashboard-stat stat-d"><h6>Total Revenue</h6><h3 th:text="${totalRevenue}">0</h3></div></div>
    </div>
</main>
<footer class="site-footer">Copyright 2026 Hotel Booking System</footer>
</body>
</html>
