<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Hotels</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<nav class="navbar navbar-expand-lg top-nav">
    <div class="container">
        <a class="navbar-brand" th:href="@{/user/dashboard}">Customer</a>
        <div class="navbar-nav ms-auto">
            <a class="nav-link" th:href="@{/user/dashboard}">Home</a>
            <a class="nav-link active" th:href="@{/user/hotels/search}">Hotels</a>
            <a class="nav-link" th:href="@{/user/search-room}">Search-Room</a>
            <a class="nav-link" th:href="@{/user/bookings}">Manage-Booking</a>
            <a class="nav-link" th:href="@{/logout}">Logout</a>
        </div>
    </div>
</nav>

<main class="container py-4">
    <section class="search-hero mb-4">
        <h1 class="h3 mb-1">Search Hotels</h1>
        <p class="mb-3">Find top hotels by city with instant availability.</p>
        <form method="get" th:action="@{/user/hotels/search}" class="search-strip p-2">
            <div class="row g-2">
                <div class="col-md-9"><input class="form-control" name="city" placeholder="Where are you going?"></div>
                <div class="col-md-3"><button class="btn btn-warning w-100" type="submit">Search</button></div>
            </div>
        </form>
    </section>

    <div class="row g-3">
        <div class="col-12" th:each="hotel : ${hotels}">
            <div class="card property-card">
                <div class="card-body">
                    <div class="row">
                        <div class="col-md-8">
                            <h2 class="h5 mb-2" th:text="${hotel.hotelName}">Hotel Name</h2>
                            <p class="mb-1"><span class="pill" th:text="${hotel.city}">City</span></p>
                            <p class="small text-muted mb-1" th:text="${hotel.description}">Description</p>
                            <a class="small" th:if="${hotel.mapsURL != null and !#strings.isEmpty(hotel.mapsURL)}"
                               th:href="${hotel.mapsURL}" target="_blank">View on Map</a>
                        </div>
                        <div class="col-md-4 d-flex align-items-end">
                            <div class="price-box w-100">
                                <div class="small text-muted">Best price for your dates</div>
                                <a class="btn btn-brand w-100 mt-2" th:href="@{/user/hotels/{id}(id=${hotel.id})}">See Availability</a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div class="col-12" th:if="${#lists.isEmpty(hotels)}">
            <div class="alert alert-light border mb-0">No hotels found for this search.</div>
        </div>
    </div>
</main>

<footer class="site-footer">Copyright 2026 Hotel Booking System</footer>
</body>
</html>
