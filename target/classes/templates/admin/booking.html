<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Manage Bookings</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<nav class="navbar navbar-expand-lg top-nav">
    <div class="container">
        <a class="navbar-brand" th:href="@{/admin/dashboard}">Admin</a>
        <div class="navbar-nav ms-auto">
            <a class="nav-link" th:href="@{/admin/dashboard}">Home</a>
            <a class="nav-link" th:href="@{/admin/hotels}">Manage-Hotels</a>
            <a class="nav-link" th:href="@{/admin/users}">Manage-User-Details</a>
            <a class="nav-link active" th:href="@{/admin/bookings}">Manage-Bookings</a>
            <a class="nav-link" th:href="@{/logout}">Logout</a>
        </div>
    </div>
</nav>
<main class="container py-4">
    <h1 class="page-title">Manage Bookings</h1>
    <div class="card section-card p-3">
        <div class="table-responsive">
            <table class="table table-striped align-middle">
                <thead><tr><th>ID</th><th>User</th><th>Hotel</th><th>Room</th><th>Check-In</th><th>Check-Out</th><th>Status</th><th>Total</th></tr></thead>
                <tbody>
                <tr th:each="booking : ${bookings}">
                    <td th:text="${booking.id}">1</td>
                    <td th:text="${booking.user.fullName}">User</td>
                    <td th:text="${booking.hotel.hotelName}">Hotel</td>
                    <td th:text="${booking.room.roomType}">Room</td>
                    <td th:text="${#temporals.format(booking.checkIn, 'yyyy-MM-dd HH:mm')}">2026-01-01 12:00</td>
                    <td th:text="${#temporals.format(booking.checkOut, 'yyyy-MM-dd HH:mm')}">2026-01-03 10:00</td>
                    <td th:text="${booking.status}">CONFIRMED</td>
                    <td th:text="${booking.tAmount}">0</td>
                </tr>
                <tr th:if="${#lists.isEmpty(bookings)}"><td colspan="8" class="text-center">No bookings found</td></tr>
                </tbody>
            </table>
        </div>
    </div>
</main>
<footer class="site-footer">Copyright 2026 Hotel Booking System</footer>
</body>
</html>
