<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Update Room</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<nav class="navbar navbar-expand-lg top-nav">
    <div class="container">
        <a class="navbar-brand" th:href="@{/manager/dashboard}">Hotel Manager</a>
        <div class="navbar-nav ms-auto">
            <a class="nav-link" th:href="@{/manager/dashboard}">Home</a>
            <a class="nav-link" th:href="@{/manager/rooms/add}">Add-Room</a>
            <a class="nav-link active" th:href="@{/manager/rooms/update}">Update-Room</a>
            <a class="nav-link" th:href="@{/manager/rooms}">Manage-Room</a>
            <a class="nav-link" th:href="@{/manager/bookings}">Manage-Booking</a>
            <a class="nav-link" th:href="@{/logout}">Logout</a>
        </div>
    </div>
</nav>

<main class="container py-4">
    <h1 class="page-title">Update Room</h1>
    <div class="card section-card p-4 mb-3">
        <div class="alert alert-success" th:if="${success}" th:text="${success}"></div>
        <div class="mb-3">
            <label class="form-label">Select Existing Room</label>
            <select class="form-select" id="roomSelector">
                <option value="">Select room</option>
                <option th:each="room : ${rooms}"
                        th:value="${room.r_id}"
                        th:attr="data-roomtype=${room.roomType},data-price=${room.pricePerNight},data-total=${room.totalRooms}"
                        th:text="'#' + ${room.r_id} + ' - ' + ${room.roomType}">
                    Room
                </option>
            </select>
        </div>

        <form th:action="@{/manager/rooms/update}" method="post" id="updateRoomForm" class="row g-3">
            <input type="hidden" name="r_id" id="r_id" required>

            <div class="col-md-6">
                <label class="form-label">Room Type</label>
                <select class="form-select" name="roomType" id="roomType" required>
                    <option value="SINGLE">SINGLE</option>
                    <option value="DOUBLE">DOUBLE</option>
                    <option value="DELUXE">DELUXE</option>
                    <option value="SUITE">SUITE</option>
                </select>
            </div>
            <div class="col-md-6">
                <label class="form-label">Price Per Night (INR)</label>
                <input class="form-control" name="pricePerNight" id="pricePerNight" type="number" step="0.01" min="1" required>
            </div>
            <div class="col-md-6">
                <label class="form-label">Total Rooms</label>
                <input class="form-control" name="totalRooms" id="totalRooms" type="number" min="0" required>
                <div class="form-text">Availability is automatic: if Total Rooms is 0, booking is disabled.</div>
            </div>
            <div class="col-12">
                <button class="btn btn-brand" type="submit">Update Room</button>
            </div>
        </form>
    </div>
</main>

<footer class="site-footer">Copyright 2026 Hotel Booking System</footer>

<script th:inline="javascript">
    const selector = document.getElementById("roomSelector");
    const selectedRoomId = /*[[${selectedRoomId}]]*/ null;

    selector.addEventListener("change", function () {
        const option = selector.options[selector.selectedIndex];
        if (!option.value) return;

        document.getElementById("r_id").value = option.value;
        document.getElementById("roomType").value = option.dataset.roomtype || "SINGLE";
        document.getElementById("pricePerNight").value = option.dataset.price || "";
        document.getElementById("totalRooms").value = option.dataset.total || "";
    });

    if (selectedRoomId) {
        selector.value = String(selectedRoomId);
        selector.dispatchEvent(new Event("change"));
    }
</script>
</body>
</html>
