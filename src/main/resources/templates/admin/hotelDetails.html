<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Hotel Details</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<nav class="navbar navbar-expand-lg top-nav">
    <div class="container">
        <a class="navbar-brand" th:href="@{/admin/dashboard}">Admin</a>
        <div class="navbar-nav ms-auto">
            <a class="nav-link" th:href="@{/admin/dashboard}">Home</a>
            <a class="nav-link active" th:href="@{/admin/hotels}">Manage-Hotels</a>
            <a class="nav-link" th:href="@{/admin/users}">Manage-User-Details</a>
            <a class="nav-link" th:href="@{/admin/bookings}">Manage-Bookings</a>
            <a class="nav-link" th:href="@{/logout}">Logout</a>
        </div>
    </div>
</nav>
<main class="container py-4">
    <h1 class="page-title">Hotel Details</h1>
    <div class="card section-card p-3 mb-3">
        <h2 class="h5 mb-2" th:text="${hotel.hotelName}">Hotel Name</h2>
        <p class="mb-1"><strong>City:</strong> <span th:text="${hotel.city}">City</span></p>
        <p class="mb-1"><strong>Description:</strong> <span th:text="${hotel.description}">Description</span></p>
        <p class="mb-0"><strong>Maps URL:</strong> <a th:href="${hotel.mapsURL}" th:text="${hotel.mapsURL}">URL</a></p>
    </div>
    <div class="card section-card p-3">
        <h3 class="h6">Rooms</h3>
        <div class="table-responsive">
            <table class="table table-striped">
                <thead><tr><th>ID</th><th>Type</th><th>Price</th><th>Total</th><th>Available</th></tr></thead>
                <tbody>
                <tr th:each="room : ${rooms}">
                    <td th:text="${room.id}">1</td>
                    <td th:text="${room.roomType}">SINGLE</td>
                    <td th:text="${room.pricePerNight}">0</td>
                    <td th:text="${room.totalRooms}">0</td>
                    <td th:text="${room.availableRooms}">true</td>
                </tr>
                <tr th:if="${#lists.isEmpty(rooms)}"><td colspan="5" class="text-center">No rooms found</td></tr>
                </tbody>
            </table>
        </div>
    </div>
</main>
<footer class="site-footer">Copyright 2026 Hotel Booking System</footer>
</body>
</html>
