<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Manager Register</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<nav class="navbar navbar-expand-lg top-nav">
    <div class="container">
        <a class="navbar-brand" th:href="@{/index}">HotelBooking</a>
        <div class="navbar-nav ms-auto">
            <a class="nav-link" th:href="@{/index}">Home</a>
            <a class="nav-link" th:href="@{/index#about}">About Us</a>
            <a class="nav-link" th:href="@{/index#hotels}">Hotel</a>
            <a class="nav-link" th:href="@{/userRegister}">User-Register</a>
            <a class="nav-link" th:href="@{/userLogin}">User-Login</a>
            <a class="nav-link active" th:href="@{/managerRegister}">Manager-Register</a>
            <a class="nav-link" th:href="@{/managerLogin}">Manager-Login</a>
            <a class="nav-link" th:href="@{/adminLogin}">Admin-Login</a>
            <a class="nav-link" th:href="@{/index#contact}">Contact Us</a>
        </div>
    </div>
</nav>
<main class="container py-4">
    <div class="row justify-content-center">
        <div class="col-lg-7">
            <div class="card section-card p-4">
                <h1 class="h4 mb-3">Hotel Manager Registration</h1>
                <form th:action="@{/managerRegister}" method="post">
                    <input type="hidden" name="role" value="ROLE_HOTEL_MANAGER">
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label">Full Name</label>
                            <input class="form-control" name="fullName" type="text" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Email</label>
                            <input class="form-control" name="email" type="email" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Password</label>
                            <input class="form-control" name="password" type="password" minlength="6" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Hotel Name</label>
                            <input class="form-control" name="hotelName" type="text" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">City</label>
                            <input class="form-control" name="city" type="text" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Google Maps URL</label>
                            <input class="form-control" name="mapsURL" type="url">
                        </div>
                        <div class="col-12">
                            <label class="form-label">Hotel Description</label>
                            <textarea class="form-control" name="description" rows="3" minlength="10" required></textarea>
                        </div>
                    </div>
                    <button class="btn btn-brand mt-3" type="submit">Register</button>
                </form>
            </div>
        </div>
    </div>
</main>
<footer class="site-footer">Copyright 2026 Hotel Booking System</footer>
</body>
</html>
